name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        working-directory: backend
        run: npx tsc --noEmit

      - name: Type-check web
        working-directory: web
        run: npx tsc --noEmit

      - name: Backend tests
        working-directory: backend
        run: npx jest --forceExit

      - name: Web tests
        working-directory: web
        run: npx vitest run

      # Phase 13 WI-1: the production build (tsc, path-alias rewrite, SQL
      # assets) and a start of the compiled server, so a build that compiles
      # but cannot boot fails here rather than on deploy.
      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Smoke-start compiled backend
        run: |
          PORT=3999 WINE_DB_PATH="$RUNNER_TEMP/smoke.db" WEB_DIST_DIR="$PWD/web/dist" \
            node backend/dist/backend/server.js &
          for i in $(seq 1 30); do curl -sf localhost:3999/healthz && break; sleep 1; done
          curl -sf localhost:3999/healthz
          curl -sf localhost:3999/api/wines
          curl -sf localhost:3999/ | grep -q '<div id="root">'
          kill -TERM %1 && wait %1

  ios:
    name: iOS · Build · Test
    # Phase 12. Separate job so a macOS runner problem never masks the
    # backend/web result above. Picks whatever iPhone simulator the runner's
    # Xcode ships rather than pinning a model name that changes yearly.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,ds in sorted(d.items(), reverse=True) if 'iOS' in r for x in ds if x['name'].startswith('iPhone')))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test \
            -project WineApp.xcodeproj \
            -scheme WineApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
