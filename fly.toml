# Phase 13 WI-2 — Fly.io configuration (spec D2–D5). Operations: docs/ops/runbook.md.
#
# `app` is a placeholder until the app exists on Fly (names are global); WI-5's
# staging run overrides it with `fly deploy -a <staging-app>`.
# Secrets are never in this file: OPENAI_API_KEY, SERPER_API_KEY and
# DEVICE_TOKENS (WI-3; production refuses to start without it) are set with
# `fly secrets set`.

app = "malolactic-wine"
primary_region = "iad" # Ashburn, nearest NYC

# server.ts drains in-flight requests on SIGTERM for up to SHUTDOWN_GRACE_MS
# (55 s), then checkpoints the WAL; kill_timeout must stay above that.
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  WINE_DB_PATH = "/data/wine.db"
  WEB_DIST_DIR = "/app/web/dist"
  # Concurrent Chromium renders across price and reviews (shared/utils/render-gate.ts).
  # WI-5 size test (2026-11-02): at 4 on performance-4x, the 14-wine run
  # peaked near 1.6 GB of 8 GB with no render failures. One per CPU.
  RENDER_CONCURRENCY = "4"
  SHUTDOWN_GRACE_MS = "55000"

# SQLite is single-writer (D4): exactly one machine, with this one volume.
[mounts]
  source = "wine_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle auto-stop (D5): stop when no requests are in flight, start on the next one.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  # /healthz is unauthenticated and never opens the database (WI-1).
  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Four dedicated CPUs, sized by WI-5 and chosen by the developer (2026-11-02).
# On shared-cpu-1x, Fly's quota (6.25% of a core once the burst balance is
# spent) throttled Chromium until the gate failed (2 of 14 wines). On
# dedicated CPUs, every size matched the laptop's 7 of 14. Time for the
# 14-wine check, against the laptop's 181 s: 1 CPU 349 s, 2 CPUs 250 s,
# 4 CPUs 221 s (no render failures). performance-4x comes with 8 GB. Billed
# per second while running; idle stop keeps the real cost to a few dollars a
# month. Do not move to a shared CPU without re-running WI-5.
[[vm]]
  memory = "8gb"
  cpu_kind = "performance"
  cpus = 4
